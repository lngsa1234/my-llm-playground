<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Four ways to arrange agents</title>
<desc>Four panels. Single agent: one loop with tools. Router: a classifier sends each request to one specialist. Orchestrator–workers: a lead agent dispatches parallel workers and combines their results. Evaluator–optimizer: a generator and a critic loop until the draft passes.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .panel { fill: none; stroke: #52514e; stroke-width: 1; stroke-dasharray: 6 4; }
    .box { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.5; }
    .lead { fill: #e6eef7; stroke: #4a6a8a; stroke-width: 0.8; }
    .t { fill: #444441; font-size: 13px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
    .h { fill: #0b0b0b; font-size: 14px; font-weight: 600; }
    .s { fill: #6b6a66; font-size: 11.5px; }
    .ln { stroke: #898781; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- 1. Single agent -->
<rect class="panel" x="10" y="10" width="320" height="240" rx="16"/>
<text class="h" x="26" y="34">1 · Single agent (Mini Muse today)</text>
<rect class="box" x="40" y="60" width="120" height="40" rx="8"/><text class="t" x="100" y="80">Request</text>
<rect class="lead" x="40" y="130" width="120" height="44" rx="8"/><text class="t" x="100" y="152">Agent loop</text>
<rect class="box" x="200" y="130" width="100" height="44" rx="8"/><text class="t" x="250" y="152">6–7 tools</text>
<line class="ln" x1="100" y1="100" x2="100" y2="128" marker-end="url(#a)"/>
<line class="ln" x1="160" y1="146" x2="198" y2="146" marker-end="url(#a)"/>
<line class="ln" x1="200" y1="160" x2="162" y2="160" marker-end="url(#a)"/>
<text class="s" x="26" y="205">One prompt, one context, every step in one trace.</text>
<text class="s" x="26" y="224">Start here; most tasks never need more.</text>

<!-- 2. Router -->
<rect class="panel" x="350" y="10" width="320" height="240" rx="16"/>
<text class="h" x="366" y="34">2 · Router</text>
<rect class="box" x="450" y="56" width="120" height="36" rx="8"/><text class="t" x="510" y="74">Request</text>
<rect class="lead" x="440" y="112" width="140" height="36" rx="8"/><text class="t" x="510" y="130">Classify (cheap call)</text>
<rect class="box" x="362" y="168" width="146" height="48" rx="8"/><text class="t" x="435" y="184">"Weather in Detroit?"</text><text class="s" x="435" y="202" text-anchor="middle">small model, 1 tool</text>
<rect class="box" x="514" y="168" width="146" height="48" rx="8"/><text class="t" x="587" y="184">"Plan + email Maya"</text><text class="s" x="587" y="202" text-anchor="middle">full agent, all tools</text>
<line class="ln" x1="510" y1="92" x2="510" y2="110" marker-end="url(#a)"/>
<line class="ln" x1="480" y1="148" x2="445" y2="166" marker-end="url(#a)"/>
<line class="ln" x1="540" y1="148" x2="577" y2="166" marker-end="url(#a)"/>
<text class="s" x="366" y="234">Exactly one path runs per request.</text>

<!-- 3. Orchestrator-workers -->
<rect class="panel" x="10" y="270" width="320" height="240" rx="16"/>
<text class="h" x="26" y="294">3 · Orchestrator–workers</text>
<rect class="lead" x="95" y="312" width="150" height="40" rx="8"/><text class="t" x="170" y="332">Lead agent (plans)</text>
<rect class="box" x="24" y="390" width="88" height="40" rx="8"/><text class="t" x="68" y="410">Worker A</text>
<rect class="box" x="126" y="390" width="88" height="40" rx="8"/><text class="t" x="170" y="410">Worker B</text>
<rect class="box" x="228" y="390" width="88" height="40" rx="8"/><text class="t" x="272" y="410">Worker C</text>
<line class="ln" x1="140" y1="352" x2="75" y2="388" marker-end="url(#a)"/>
<line class="ln" x1="170" y1="352" x2="170" y2="388" marker-end="url(#a)"/>
<line class="ln" x1="200" y1="352" x2="265" y2="388" marker-end="url(#a)"/>
<text class="s" x="26" y="458">Workers run in parallel, each in its own context,</text>
<text class="s" x="26" y="476">and return short results the lead combines.</text>
<text class="s" x="26" y="494">Also called a supervisor or "super agent".</text>

<!-- 4. Evaluator-optimizer -->
<rect class="panel" x="350" y="270" width="320" height="240" rx="16"/>
<text class="h" x="366" y="294">4 · Evaluator–optimizer</text>
<rect class="lead" x="375" y="350" width="120" height="44" rx="8"/><text class="t" x="435" y="372">Generator drafts</text>
<rect class="box" x="525" y="350" width="120" height="44" rx="8"/><text class="t" x="585" y="372">Critic checks</text>
<path class="ln" d="M495 360 L523 360" marker-end="url(#a)"/>
<path class="ln" d="M525 384 L497 384" marker-end="url(#a)"/>
<text class="s" x="487" y="410" text-anchor="middle">feedback</text>
<line class="ln" x1="585" y1="394" x2="585" y2="430" marker-end="url(#a)"/>
<text class="t" x="585" y="444">Passes → done</text>
<text class="s" x="366" y="476">Loop until the critic passes it,</text>
<text class="s" x="366" y="494">capped at a few rounds.</text>
</svg>
