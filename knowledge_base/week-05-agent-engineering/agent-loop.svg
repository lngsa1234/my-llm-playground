<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="640" height="680" role="img">
  <title>Agent loop</title>
  <desc>Agent loop where the model decides the next step: Ask LLM, Run action, Add result to context, then back to Ask LLM. Repeats until done.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  </style>

  <rect x="20" y="20" width="600" height="640" rx="40" fill="#E4F3EC" stroke="#4F8A72" stroke-width="1"/>
  <text x="320" y="78" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="500" fill="#1F4D3B">Agent loop</text>
  <text x="320" y="122" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#3E7A61">Model decides next step</text>

  <rect x="88" y="174" width="440" height="96" rx="16" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
  <text x="308" y="222" text-anchor="middle" dominant-baseline="central" font-size="28" fill="#1A1A1A">Ask LLM</text>

  <line x1="308" y1="270" x2="308" y2="322" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="88" y="328" width="440" height="96" rx="16" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
  <text x="308" y="376" text-anchor="middle" dominant-baseline="central" font-size="28" fill="#1A1A1A">Run action</text>

  <line x1="308" y1="424" x2="308" y2="476" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="88" y="482" width="440" height="96" rx="16" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
  <text x="308" y="530" text-anchor="middle" dominant-baseline="central" font-size="28" fill="#1A1A1A">Add result to context</text>

  <path d="M528 530 L582 530 L582 222 L532 222" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="330" y="626" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#5F5E5A">↻ repeats until done</text>
</svg>
