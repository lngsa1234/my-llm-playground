<svg width="100%" viewBox="0 0 680 674" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Sessions, tasks, short-term memory, transcripts, and long-term memory</title>
<desc>A live session holds one shared short-term memory (the context window) used by several tasks, each with its own control state. Task 3 delegates to a subagent with its own fresh context, which returns only a result. The session saves to and resumes from its own transcript. Transcripts feed long-term memory by extraction. The session writes to and retrieves from long-term memory, which other sessions also use.</desc>
<defs>
  <style>
    .live { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 0.6; }
    .live-h { fill: #085041; font-size: 14px; font-weight: 600; }
    .live-s { fill: #0f6e56; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #b4b2a9; stroke-width: 0.6; }
    .saved { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.6; }
    .shared { fill: #eeedfe; stroke: #534ab7; stroke-width: 0.6; }
    .shared-h { fill: #3c3489; font-size: 14px; font-weight: 600; }
    .shared-s { fill: #534ab7; font-size: 12.5px; }
    .h { fill: #0b0b0b; font-size: 14px; font-weight: 600; }
    .s { fill: #444441; font-size: 12.5px; }
    .ln { stroke: #898781; stroke-width: 1.5; fill: none; }
  </style>
  <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="live" x="40" y="30" width="600" height="364" rx="20"/>
<text class="live-h" x="340" y="56" text-anchor="middle" dominant-baseline="central">Session A (live)</text>
<text class="live-s" x="340" y="74" text-anchor="middle" dominant-baseline="central">One thread, several tasks</text>

<rect class="box" x="60" y="90" width="560" height="56" rx="8"/>
<text class="h" x="340" y="108" text-anchor="middle" dominant-baseline="central">Short-term memory (shared)</text>
<text class="s" x="340" y="128" text-anchor="middle" dominant-baseline="central">The context window, used by every task</text>

<line class="ln" x1="145" y1="150" x2="145" y2="172" marker-start="url(#m)" marker-end="url(#m)"/>
<line class="ln" x1="340" y1="150" x2="340" y2="172" marker-start="url(#m)" marker-end="url(#m)"/>
<line class="ln" x1="535" y1="150" x2="535" y2="172" marker-start="url(#m)" marker-end="url(#m)"/>

<rect class="box" x="60" y="176" width="170" height="56" rx="8"/>
<text class="h" x="145" y="194" text-anchor="middle" dominant-baseline="central">Task 1: done</text>
<text class="s" x="145" y="214" text-anchor="middle" dominant-baseline="central">Own control state</text>

<rect class="box" x="255" y="176" width="170" height="56" rx="8"/>
<text class="h" x="340" y="194" text-anchor="middle" dominant-baseline="central">Task 2: running</text>
<text class="s" x="340" y="214" text-anchor="middle" dominant-baseline="central">Own control state</text>

<rect class="box" x="450" y="176" width="170" height="56" rx="8"/>
<text class="h" x="535" y="194" text-anchor="middle" dominant-baseline="central">Task 3: delegated</text>
<text class="s" x="535" y="214" text-anchor="middle" dominant-baseline="central">Own control state</text>

<line class="ln" x1="515" y1="234" x2="515" y2="312" marker-end="url(#m)"/>
<text class="s" x="505" y="273" text-anchor="end" dominant-baseline="central">Delegate</text>
<line class="ln" x1="555" y1="314" x2="555" y2="236" marker-end="url(#m)"/>
<text class="s" x="565" y="273" text-anchor="start" dominant-baseline="central">Result</text>

<rect class="box" x="450" y="316" width="170" height="56" rx="8" stroke-dasharray="4 3"/>
<text class="h" x="535" y="334" text-anchor="middle" dominant-baseline="central">Subagent</text>
<text class="s" x="535" y="354" text-anchor="middle" dominant-baseline="central">Own fresh context</text>

<line class="ln" x1="120" y1="396" x2="120" y2="466" marker-end="url(#m)"/>
<text class="s" x="110" y="431" text-anchor="end" dominant-baseline="central">Save</text>
<line class="ln" x1="210" y1="468" x2="210" y2="398" marker-end="url(#m)"/>
<text class="s" x="220" y="431" text-anchor="start" dominant-baseline="central">Resume</text>
<line class="ln" x1="470" y1="396" x2="470" y2="466" marker-end="url(#m)"/>
<text class="s" x="460" y="431" text-anchor="end" dominant-baseline="central">Write</text>
<line class="ln" x1="560" y1="468" x2="560" y2="398" marker-end="url(#m)"/>
<text class="s" x="570" y="431" text-anchor="start" dominant-baseline="central">Retrieve</text>

<rect class="saved" x="40" y="470" width="250" height="56" rx="8"/>
<text class="h" x="165" y="488" text-anchor="middle" dominant-baseline="central">Session transcripts</text>
<text class="s" x="165" y="508" text-anchor="middle" dominant-baseline="central">Full log, one per session</text>

<line class="ln" x1="292" y1="498" x2="386" y2="498" marker-end="url(#m)"/>
<text class="s" x="339" y="482" text-anchor="middle" dominant-baseline="central">Extract</text>

<rect class="shared" x="390" y="470" width="250" height="56" rx="8"/>
<text class="shared-h" x="515" y="488" text-anchor="middle" dominant-baseline="central">Long-term memory</text>
<text class="shared-s" x="515" y="508" text-anchor="middle" dominant-baseline="central">Facts, searchable episodes</text>

<line class="ln" x1="515" y1="530" x2="515" y2="572" marker-start="url(#m)" marker-end="url(#m)"/>
<rect class="box" x="415" y="576" width="200" height="44" rx="8"/>
<text class="h" x="515" y="598" text-anchor="middle" dominant-baseline="central">Other sessions</text>

<text class="s" x="340" y="650" text-anchor="middle" dominant-baseline="central">Green: live session. Gray: saved per session. Purple: shared across sessions.</text>
</svg>
